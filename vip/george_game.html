<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>George 游戏 | 老付家</title>
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; --gold: #f1c40f; --bg: #f8f9fa; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--primary); touch-action: manipulation; }
        .header { background: white; padding: 12px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.2rem; }
        .header .back { color: #7f8c8d; text-decoration: none; font-size: 0.9rem; }
        .session-bar { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 10px; background: linear-gradient(135deg, #1a1a2e, #302b63); color: white; font-size: 0.9rem; }
        .session-bar .timer { color: #f1c40f; font-weight: bold; font-size: 1.1rem; }
        .session-bar .timer.urgent { color: #e74c3c; }
        .currency-bar { display: flex; gap: 8px; justify-content: center; padding: 10px; background: linear-gradient(135deg, #fef9e7, #fff); flex-wrap: wrap; }
        .currency-item { font-size: 0.9rem; cursor: pointer; padding: 4px 10px; border-radius: 8px; background: rgba(255,255,255,0.8); }
        .currency-item.gold { color: #d4a017; font-weight: bold; }
        .currency-item.silver { color: #7f8c8d; font-weight: bold; }
        .currency-item.copper { color: #8b4513; font-weight: bold; }
        .game-list { max-width: 500px; margin: 20px auto; padding: 0 16px; }
        .game-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); cursor: pointer; transition: all 0.3s; border: 2px solid transparent; }
        .game-card:hover, .game-card:active { border-color: var(--gold); transform: translateY(-2px); }
        .game-card .icon { font-size: 2.5rem; float: left; margin-right: 15px; }
        .game-card .title { font-size: 1.1rem; font-weight: bold; margin-bottom: 4px; }
        .game-card .desc { color: #7f8c8d; font-size: 0.85rem; }
        .time-select { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 50; align-items: center; justify-content: center; }
        .time-select.active { display: flex; }
        .time-card { background: white; padding: 30px; border-radius: 20px; text-align: center; max-width: 380px; width: 90%; }
        .time-card h3 { margin-bottom: 15px; }
        .time-option { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; margin: 8px 0; background: #f8f9fa; border: 2px solid #ecf0f1; border-radius: 12px; cursor: pointer; transition: all 0.2s; }
        .time-option:hover, .time-option:active { border-color: var(--gold); background: #fef9e7; }
        .time-option.disabled { opacity: 0.4; cursor: not-allowed; }
        .time-option .time-label { font-weight: bold; font-size: 1.1rem; }
        .time-option .time-cost { color: var(--accent); font-weight: bold; }
        .time-option .time-cost.expensive { color: #e74c3c; }
        .time-info { color: #95a5a6; font-size: 0.8rem; margin-top: 10px; }
        .time-cancel { margin-top: 15px; color: #95a5a6; border: none; background: none; font-size: 0.9rem; cursor: pointer; }
        .game-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a2e; z-index: 100; }
        .game-toolbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; background: rgba(0,0,0,0.5); color: white; font-size: 0.9rem; position: absolute; top: 0; left: 0; right: 0; z-index: 10; }
        .game-toolbar button { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 14px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; }
        .game-timer { color: #f1c40f; font-weight: bold; }
        #gameCanvas { display: block; width: 100%; height: calc(100% - 40px); margin-top: 40px; }
        .game-over-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; }
        .game-over-overlay.active { display: flex; }
        .game-over-card { background: white; padding: 35px; border-radius: 20px; text-align: center; max-width: 350px; width: 90%; }
        .game-over-card h2 { margin-bottom: 10px; }
        .game-over-card .score { font-size: 2rem; color: var(--accent); font-weight: bold; margin: 15px 0; }
        .game-over-card button { padding: 12px 28px; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; margin: 5px; }
        .btn-retry { background: var(--gold); color: white; }
        .btn-switch { background: #3498db; color: white; }
        .btn-quit { background: #ecf0f1; color: #7f8c8d; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 12px 24px; border-radius: 12px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div id="menuView">
        <div class="header">
            <a href="george.html" class="back">← 返回</a>
            <h1>🎮 George 的游戏</h1>
            <span></span>
        </div>
        <div id="sessionBar" class="session-bar" style="display:none">
            ⏱️ 剩余时间：<span class="timer" id="sessionTimer">--:--</span>
        </div>
        <div id="currencyBar"></div>
        <div class="game-list">
            <div class="game-card" onclick="playGame('frogjump')">
                <div class="icon">🐸</div>
                <div class="title">青蛙跳台</div>
                <div class="desc">跳上平台，收集宝石！点屏幕或按空格跳跃。</div>
            </div>
            <div class="game-card" onclick="playGame('carrace')">
                <div class="icon">🚗</div>
                <div class="title">赛车竞速</div>
                <div class="desc">躲开敌车！点屏幕左右或按←→换道。</div>
            </div>
            <div class="game-card" onclick="playGame('snake')">
                <div class="icon">🐍</div>
                <div class="title">贪吃蛇</div>
                <div class="desc">方向键或WASD控制，吃食物变长！数字键调速。</div>
            </div>
        </div>
    </div>

    <div class="time-select" id="timeSelect">
        <div class="time-card">
            <h3>⏱️ 选择游玩时间</h3>
            <p style="color:#7f8c8d;font-size:0.85rem;margin-bottom:12px">选好时间后可以自由切换游戏</p>
            <div id="timeOptions"></div>
            <div class="time-info" id="timeInfo"></div>
            <button class="time-cancel" onclick="cancelTimeSelect()">取消返回</button>
        </div>
    </div>

    <div class="game-container" id="gameContainer">
        <div class="game-toolbar">
            <button onclick="backToGameList()">← 换游戏</button>
            <span class="game-timer" id="gameTimer"></span>
            <span id="gameScore">得分: 0</span>
        </div>
        <canvas id="gameCanvas" width="800" height="556"></canvas>
    </div>

    <div class="game-over-overlay" id="gameOverOverlay">
        <div class="game-over-card">
            <h2 id="gameOverTitle">游戏结束</h2>
            <div class="score" id="finalScore">0</div>
            <p id="rewardMsg"></p>
            <div style="margin-top:20px">
                <button class="btn-retry" id="retryBtn" onclick="retryGame()">再来一局</button>
                <button class="btn-switch" id="switchBtn" onclick="backToGameList()">换游戏</button>
                <button class="btn-quit" onclick="endSession()">结束</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="vip_common.js?v=6"></script>
    <script src="../games/xiaobawang/games/frogjump.js"></script>
    <script src="../games/xiaobawang/games/carrace.js"></script>
    <script src="../games/xiaobawang/games/snake.js"></script>
    <script>
        const USER_ID = 'george';
        let currentGame = null;
        let currentGameKey = null;
        let sessionDuration = 0;
        let sessionCost = 0;
        let sessionTimerInterval = null;
        let sessionTimeLeft = 0;
        let sessionActive = false;

        const TIME_OPTIONS = [
            { minutes: 1, baseCost: 10 },
            { minutes: 3, baseCost: 30 },
            { minutes: 5, baseCost: 50 },
        ];

        function _todayGameKey() { return 'vip_game_time_' + USER_ID + '_' + new Date().toISOString().slice(0, 10); }

        function _getTodayGameMinutes() {
            try { return parseInt(localStorage.getItem(_todayGameKey()) || '0', 10); } catch(e) { return 0; }
        }

        function _addGameMinutes(min) {
            const newVal = _getTodayGameMinutes() + min;
            try { localStorage.setItem(_todayGameKey(), String(newVal)); } catch(e) {}
            const date = new Date().toISOString().slice(0, 10);
            _apiPost('/api/daily/' + USER_ID, { type: 'game_time', date: date, value: newVal });
        }

        function _syncGameTime() {
            const date = new Date().toISOString().slice(0, 10);
            _apiGet('/api/daily/' + USER_ID + '?type=game_time&date=' + date).then(data => {
                if (data && typeof data.value === 'number' && data.value > 0) {
                    try { localStorage.setItem(_todayGameKey(), String(data.value)); } catch(e) {}
                }
            });
        }

        function _getMultiplier() {
            const played = _getTodayGameMinutes();
            if (played >= 10) return 3;
            if (played >= 5) return 2;
            return 1;
        }

        function init() {
            if (!VipSession.requireAuth('george')) return;
            VipLogin.record(USER_ID);
            renderCurrencyBar(document.getElementById('currencyBar'), USER_ID);
            try { vipCloudSync(USER_ID); } catch(e) {}
            _syncGameTime();
            showTimeSelect();
        }

        function showTimeSelect() {
            const bal = VipCurrency.getBalance(USER_ID);
            const played = _getTodayGameMinutes();
            const mult = _getMultiplier();

            const container = document.getElementById('timeOptions');
            const info = document.getElementById('timeInfo');
            let html = '';

            TIME_OPTIONS.forEach(opt => {
                const cost = opt.baseCost * mult;
                const canAfford = bal.copper >= cost;
                const cls = canAfford ? '' : ' disabled';
                const costCls = mult > 1 ? ' expensive' : '';
                html += '<div class="time-option' + cls + '" onclick="' + (canAfford ? 'startSession(' + opt.minutes + ',' + cost + ')' : '') + '">';
                html += '<span class="time-label">' + opt.minutes + '分钟</span>';
                html += '<span class="time-cost' + costCls + '">' + cost + '文铜钱</span>';
                html += '</div>';
            });

            container.innerHTML = html;
            let infoText = '今天已玩：' + played + '分钟';
            if (mult > 1) infoText += ' | 费用×' + mult + '（超过' + (mult === 2 ? '5' : '10') + '分钟）';
            info.textContent = infoText;

            document.getElementById('timeSelect').classList.add('active');
        }

        function cancelTimeSelect() {
            window.location.href = 'george.html';
        }

        function startSession(minutes, cost) {
            const result = VipCurrency.spendCopper(USER_ID, cost, '游戏' + minutes + '分钟');
            if (!result) { showToast('铜钱不够！'); return; }

            sessionDuration = minutes;
            sessionCost = cost;
            sessionTimeLeft = minutes * 60;
            sessionActive = true;

            renderCurrencyBar(document.getElementById('currencyBar'), USER_ID);
            document.getElementById('timeSelect').classList.remove('active');
            document.getElementById('sessionBar').style.display = 'flex';
            updateSessionTimer();

            VipTime.startTracking(USER_ID, 'game');

            if (sessionTimerInterval) clearInterval(sessionTimerInterval);
            sessionTimerInterval = setInterval(() => {
                sessionTimeLeft--;
                updateSessionTimer();
                if (document.getElementById('gameContainer').style.display === 'block') {
                    updateGameTimer();
                }
                if (sessionTimeLeft <= 0) {
                    clearInterval(sessionTimerInterval);
                    sessionTimerInterval = null;
                    sessionTimeUp();
                }
            }, 1000);
        }

        function updateSessionTimer() {
            const m = Math.floor(sessionTimeLeft / 60);
            const s = sessionTimeLeft % 60;
            const el = document.getElementById('sessionTimer');
            el.textContent = m + ':' + String(s).padStart(2, '0');
            el.className = 'timer' + (sessionTimeLeft <= 10 ? ' urgent' : '');
        }

        function updateGameTimer() {
            const m = Math.floor(sessionTimeLeft / 60);
            const s = sessionTimeLeft % 60;
            const el = document.getElementById('gameTimer');
            el.textContent = '⏱ ' + m + ':' + String(s).padStart(2, '0');
            el.style.color = sessionTimeLeft <= 10 ? '#e74c3c' : '#f1c40f';
        }

        function playGame(gameKey) {
            if (!sessionActive) { showTimeSelect(); return; }
            currentGameKey = gameKey;
            document.getElementById('menuView').style.display = 'none';
            document.getElementById('gameContainer').style.display = 'block';
            document.getElementById('gameScore').textContent = '得分: 0';
            updateGameTimer();
            launchCurrentGame();
        }

        function launchCurrentGame() {
            const canvas = document.getElementById('gameCanvas');
            canvas.width = 800;
            canvas.height = 556;

            if (currentGameKey === 'frogjump') {
                window.onFrogJumpScore = (s) => { document.getElementById('gameScore').textContent = '得分: ' + s; };
                window.onFrogJumpOver = (s) => gameOver(s);
                if (window.frogJumpInstance) window.frogJumpInstance.stop();
                currentGame = new FrogJump(canvas);
                window.frogJumpInstance = currentGame;
                currentGame.start();
            } else if (currentGameKey === 'carrace') {
                window._crLanes = 3;
                window.onCarRaceScore = (s) => { document.getElementById('gameScore').textContent = '得分: ' + s; };
                window.onCarRaceOver = (s) => gameOver(s);
                if (window.carRaceInstance) window.carRaceInstance.stop();
                currentGame = new CarRace(canvas, 3);
                window.carRaceInstance = currentGame;
                currentGame.start();
            } else if (currentGameKey === 'snake') {
                window.onSnakeScore = (s) => { document.getElementById('gameScore').textContent = '得分: ' + s; };
                window.onSnakeOver = (s) => gameOver(s);
                if (window.snakeInstance) window.snakeInstance.stop();
                currentGame = new SnakeGame(canvas);
                window.snakeInstance = currentGame;
                currentGame.start();
            }
        }

        function sessionTimeUp() {
            sessionActive = false;
            VipTime.stopTracking();
            _addGameMinutes(sessionDuration);
            if (currentGame) { currentGame.stop(); currentGame = null; }
            document.getElementById('gameContainer').style.display = 'none';
            document.getElementById('menuView').style.display = 'block';
            document.getElementById('sessionBar').style.display = 'none';

            document.getElementById('gameOverTitle').textContent = '⏱️ 时间到！';
            document.getElementById('finalScore').textContent = '本次游玩 ' + sessionDuration + '分钟';
            document.getElementById('rewardMsg').textContent = '消耗 ' + sessionCost + '文铜钱';
            document.getElementById('retryBtn').style.display = 'none';
            document.getElementById('switchBtn').style.display = 'none';
            document.getElementById('gameOverOverlay').classList.add('active');

            renderCurrencyBar(document.getElementById('currencyBar'), USER_ID);
        }

        function gameOver(score) {
            if (!sessionActive) return;
            document.getElementById('gameOverTitle').textContent = '游戏结束';
            document.getElementById('finalScore').textContent = score;
            const remaining = Math.ceil(sessionTimeLeft / 60);
            document.getElementById('rewardMsg').textContent = '还剩 ' + remaining + ' 分钟，可以继续';
            document.getElementById('retryBtn').style.display = 'inline-block';
            document.getElementById('switchBtn').style.display = 'inline-block';
            document.getElementById('gameOverOverlay').classList.add('active');
        }

        function retryGame() {
            document.getElementById('gameOverOverlay').classList.remove('active');
            if (!sessionActive) { endSession(); return; }
            if (currentGame) currentGame.stop();
            launchCurrentGame();
        }

        function backToGameList() {
            document.getElementById('gameOverOverlay').classList.remove('active');
            if (currentGame) { currentGame.stop(); currentGame = null; }
            document.getElementById('gameContainer').style.display = 'none';
            document.getElementById('menuView').style.display = 'block';
        }

        function endSession() {
            document.getElementById('gameOverOverlay').classList.remove('active');
            VipTime.stopTracking();
            if (sessionTimerInterval) { clearInterval(sessionTimerInterval); sessionTimerInterval = null; }
            if (sessionActive) {
                _addGameMinutes(Math.ceil((sessionDuration * 60 - sessionTimeLeft) / 60));
            }
            if (currentGame) { currentGame.stop(); currentGame = null; }
            sessionActive = false;
            document.getElementById('gameContainer').style.display = 'none';
            document.getElementById('menuView').style.display = 'block';
            document.getElementById('sessionBar').style.display = 'none';
            renderCurrencyBar(document.getElementById('currencyBar'), USER_ID);
            window.location.href = 'george.html';
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        window.activateTimer = function() {};
        window.drawTimerOverlay = function() {};
        init();
    </script>
</body>
</html>
