<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>George 做题 | 老付家</title>
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; --gold: #f1c40f; --bg: #f8f9fa; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--primary); margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; width: 90%; max-width: 500px; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #95a5a6; margin-bottom: 30px; }
        .placeholder { padding: 40px 20px; background: #fef9e7; border-radius: 16px; border: 2px dashed #f9e79f; }
        .placeholder .icon { font-size: 4rem; margin-bottom: 15px; }
        .placeholder p { color: #7f8c8d; line-height: 1.6; margin: 0; }
        .back { display: inline-block; margin-top: 25px; color: #7f8c8d; text-decoration: none; font-size: 0.9rem; }
        .back:hover { color: var(--accent); }
    </style>
</head>
<body>
    <div class="card">
        <h1>✍️ 做题</h1>
        <p class="subtitle">George 的识字练习</p>
        <div class="placeholder">
            <div class="icon">🚧</div>
            <p>识字练习功能正在搭建中……<br>即将支持五年级（P5）汉字练习！<br><br>敬请期待！</p>
        </div>
        <a href="george.html" class="back">← 返回我的空间</a>
    </div>
    <script>
        try { if (sessionStorage.getItem('vip_auth_george') !== '1') window.location.href = 'index.html'; } catch(e) {}
    </script>
</body>
</html>
