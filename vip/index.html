<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>VIP 专区 | 老付家</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e67e22;
            --gold: #f1c40f;
            --bg-color: #f8f9fa;
        }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg-color); color: var(--primary-color); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: white; width: 90%; max-width: 500px; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
        h1 { font-size: 2.2rem; margin-bottom: 10px; }
        h1 span { color: var(--gold); }
        p { color: #7f8c8d; line-height: 1.6; }
        .users { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-top: 30px; }
        .user-card { padding: 25px 15px; background: linear-gradient(135deg, #fff 0%, #fef9e7 100%); border: 2px solid #f9e79f; border-radius: 16px; text-decoration: none; color: var(--primary-color); transition: all 0.3s ease; cursor: pointer; }
        .user-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(241,196,15,0.3); border-color: var(--gold); }
        .user-avatar { font-size: 3rem; margin-bottom: 10px; }
        .user-name { font-size: 1.1rem; font-weight: bold; }
        .back { display: inline-block; margin-top: 30px; color: #7f8c8d; text-decoration: none; font-size: 0.9rem; }
        .back:hover { color: var(--accent-color); }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; padding: 35px; border-radius: 20px; width: 90%; max-width: 360px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .modal h2 { margin: 0 0 5px; font-size: 1.3rem; }
        .modal .modal-avatar { font-size: 3rem; margin-bottom: 10px; }
        .modal .hint { color: #95a5a6; font-size: 0.85rem; margin-bottom: 20px; }
        .modal input { width: 100%; padding: 12px 16px; border: 2px solid #ecf0f1; border-radius: 10px; font-size: 1rem; box-sizing: border-box; outline: none; transition: border-color 0.3s; }
        .modal input:focus { border-color: var(--gold); }
        .modal .error { color: #e74c3c; font-size: 0.85rem; margin-top: 8px; display: none; }
        .modal .info { color: #2980b9; font-size: 0.85rem; margin-top: 8px; display: none; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .modal-buttons button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .btn-login { background: linear-gradient(135deg, var(--gold), #f39c12); color: white; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(241,196,15,0.4); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-cancel { background: #ecf0f1; color: #7f8c8d; }
        .btn-cancel:hover { background: #dfe6e9; }
        .btn-call { background: linear-gradient(135deg, #3498db, #2980b9); color: white; }
        .btn-call:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(52,152,219,0.4); }
        .btn-call:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
        .divider { display: flex; align-items: center; gap: 10px; margin: 15px 0; color: #bdc3c7; font-size: 0.85rem; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #ecf0f1; }
        .poll-status { margin-top: 12px; padding: 12px; background: #eaf6fd; border-radius: 10px; text-align: center; display: none; }
        .poll-status .countdown { font-size: 1.5rem; font-weight: bold; color: #2980b9; }
        .poll-status .poll-msg { font-size: 0.85rem; color: #7f8c8d; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <h1><span>👑</span> VIP 专区</h1>
        <p>老付家尊贵会员</p>

        <div class="users" style="grid-template-columns: 1fr 1fr;">
            <div class="user-card" onclick="showLogin('zy26')">
                <div class="user-avatar" id="avatar_zy26">🐯</div>
                <div class="user-name">ZY26</div>
            </div>
            <div class="user-card" onclick="showLogin('george')">
                <div class="user-avatar" id="avatar_george">🐵</div>
                <div class="user-name">George</div>
            </div>
            <div class="user-card" onclick="showLogin('tom')">
                <div class="user-avatar" id="avatar_tom">🐱</div>
                <div class="user-name">Tom</div>
            </div>
            <div class="user-card" onclick="showLogin('jerry')">
                <div class="user-avatar" id="avatar_jerry">🧑‍💻</div>
                <div class="user-name">Jerry</div>
            </div>
        </div>

        <a href="../index.html" class="back">← 返回主页</a>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <div class="modal-avatar" id="modalAvatar"></div>
            <h2 id="modalName"></h2>
            <p class="hint">选择登录方式</p>
            <input type="password" id="passwordInput" placeholder="输入密码" onkeydown="if(event.key==='Enter')doLogin()">
            <div class="error" id="errorMsg">密码错误，请重试</div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="hideLogin()">取消</button>
                <button class="btn-login" id="loginBtn" onclick="doLogin()">密码登录</button>
            </div>
            <div class="divider">或</div>
            <button class="btn-call" id="callBtn" onclick="doCallLogin()" style="width:100%;padding:12px;border:none;border-radius:10px;font-size:1rem;font-weight:bold;cursor:pointer">📞 呼叫管理员登录</button>
            <div class="poll-status" id="pollStatus">
                <div class="countdown" id="pollCountdown">300</div>
                <div class="poll-msg">等待管理员审批中...</div>
            </div>
            <div class="info" id="infoMsg"></div>
        </div>
    </div>

    <script>
        const API = '';
        const users = {
            zy26:   { name: 'ZY26',   avatar: '🐯', page: 'zy26.html' },
            george: { name: 'George', avatar: '🐵', page: 'george.html' },
            tom:    { name: 'Tom',    avatar: '🐱', page: 'tom.html' },
            jerry:  { name: 'Jerry',  avatar: '🧑‍💻', page: 'jerry.html' }
        };
        let currentUser = null;

        let pollInterval = null;
        let countdownInterval = null;

        function showLogin(uid) {
            currentUser = uid;
            const u = users[uid];
            document.getElementById('modalAvatar').textContent = u.avatar;
            document.getElementById('modalName').textContent = u.name;
            document.getElementById('passwordInput').value = '';
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('infoMsg').style.display = 'none';
            document.getElementById('loginBtn').disabled = false;
            document.getElementById('loginBtn').textContent = '密码登录';
            document.getElementById('callBtn').disabled = false;
            document.getElementById('callBtn').textContent = '📞 呼叫管理员登录';
            document.getElementById('pollStatus').style.display = 'none';
            document.getElementById('loginModal').classList.add('active');
            setTimeout(() => document.getElementById('passwordInput').focus(), 100);
        }

        function hideLogin() {
            document.getElementById('loginModal').classList.remove('active');
            currentUser = null;
            if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
            if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
        }

        async function doLogin() {
            const pw = document.getElementById('passwordInput').value;
            if (!pw) return;

            const btn = document.getElementById('loginBtn');
            const errEl = document.getElementById('errorMsg');
            btn.disabled = true;
            btn.textContent = '登录中...';
            errEl.style.display = 'none';

            const loginUrl = (API || window.location.origin) + '/api/auth/login';
            try {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 8000);
                const resp = await fetch(loginUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUser, password: pw }),
                    signal: ctrl.signal,
                });
                clearTimeout(timer);
                const text = await resp.text();
                let data;
                try { data = JSON.parse(text); } catch(pe) {
                    errEl.textContent = '服务器返回格式错误 (HTTP ' + resp.status + ')';
                    errEl.style.display = 'block';
                    btn.disabled = false; btn.textContent = '登录';
                    return;
                }

                if (data.ok && data.token) {
                    try {
                        sessionStorage.setItem('vip_session', JSON.stringify({
                            token: data.token,
                            userId: data.userId,
                            name: data.name,
                        }));
                    } catch(e) {}
                    window.location.href = users[currentUser].page;
                } else {
                    errEl.textContent = data.error === 'invalid credentials' ? '密码错误，请重试' : ('登录失败: ' + (data.error || resp.status));
                    errEl.style.display = 'block';
                    document.getElementById('passwordInput').value = '';
                    document.getElementById('passwordInput').focus();
                    btn.disabled = false;
                    btn.textContent = '登录';
                }
            } catch(e) {
                errEl.textContent = e.name === 'AbortError' ? '请求超时(8秒)，请重试' : '网络错误: ' + e.message;
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = '登录';
            }
        }

        async function doCallLogin() {
            const callBtn = document.getElementById('callBtn');
            const errEl = document.getElementById('errorMsg');
            const infoEl = document.getElementById('infoMsg');
            const pollStatusEl = document.getElementById('pollStatus');
            const countdownEl = document.getElementById('pollCountdown');

            callBtn.disabled = true;
            callBtn.textContent = '发送中...';
            errEl.style.display = 'none';
            infoEl.style.display = 'none';

            const requestUrl = (API || window.location.origin) + '/api/auth/request-login';
            try {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 8000);
                const resp = await fetch(requestUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUser }),
                    signal: ctrl.signal,
                });
                clearTimeout(timer);
                const data = await resp.json();

                if (!data.ok || !data.token) {
                    errEl.textContent = data.error || '请求失败';
                    errEl.style.display = 'block';
                    callBtn.disabled = false;
                    callBtn.textContent = '📞 呼叫管理员登录';
                    return;
                }

                callBtn.textContent = '⏳ 已发送，等待审批';
                pollStatusEl.style.display = 'block';
                let secondsLeft = 300;
                countdownEl.textContent = secondsLeft;

                countdownInterval = setInterval(() => {
                    secondsLeft--;
                    countdownEl.textContent = secondsLeft;
                    if (secondsLeft <= 0) {
                        clearInterval(countdownInterval); countdownInterval = null;
                        clearInterval(pollInterval); pollInterval = null;
                        pollStatusEl.style.display = 'none';
                        errEl.textContent = '请求已过期，请重试';
                        errEl.style.display = 'block';
                        callBtn.disabled = false;
                        callBtn.textContent = '📞 呼叫管理员登录';
                    }
                }, 1000);

                const pollUrl = (API || window.location.origin) + '/api/auth/poll/' + data.token;
                pollInterval = setInterval(async () => {
                    try {
                        const pr = await fetch(pollUrl);
                        const pd = await pr.json();

                        if (pd.status === 'approved' && pd.sessionToken) {
                            clearInterval(pollInterval); pollInterval = null;
                            clearInterval(countdownInterval); countdownInterval = null;
                            try {
                                sessionStorage.setItem('vip_session', JSON.stringify({
                                    token: pd.sessionToken,
                                    userId: pd.userId,
                                    name: pd.name,
                                }));
                            } catch(e) {}
                            window.location.href = users[currentUser].page;
                        } else if (pd.status === 'rejected') {
                            clearInterval(pollInterval); pollInterval = null;
                            clearInterval(countdownInterval); countdownInterval = null;
                            pollStatusEl.style.display = 'none';
                            errEl.textContent = '管理员拒绝了登录请求';
                            errEl.style.display = 'block';
                            callBtn.disabled = false;
                            callBtn.textContent = '📞 呼叫管理员登录';
                        } else if (pd.status === 'expired') {
                            clearInterval(pollInterval); pollInterval = null;
                            clearInterval(countdownInterval); countdownInterval = null;
                            pollStatusEl.style.display = 'none';
                            errEl.textContent = '请求已过期，请重试';
                            errEl.style.display = 'block';
                            callBtn.disabled = false;
                            callBtn.textContent = '📞 呼叫管理员登录';
                        }
                    } catch(e) {}
                }, 3000);

            } catch(e) {
                errEl.textContent = e.name === 'AbortError' ? '请求超时' : '网络错误: ' + e.message;
                errEl.style.display = 'block';
                callBtn.disabled = false;
                callBtn.textContent = '📞 呼叫管理员登录';
            }
        }

        document.getElementById('loginModal').addEventListener('click', function(e) {
            if (e.target === this) hideLogin();
        });

        function loadAvatars() {
            const uids = ['zy26', 'george', 'tom', 'jerry'];
            uids.forEach(uid => {
                fetch(API + '/api/avatar/' + uid).then(r => r.json()).then(data => {
                    if (data && data.avatar) {
                        const el = document.getElementById('avatar_' + uid);
                        if (el) el.textContent = data.avatar;
                        users[uid].avatar = data.avatar;
                    }
                }).catch(() => {});
            });
        }
        loadAvatars();

        const hashUser = window.location.hash.slice(1);
        if (hashUser && users[hashUser]) {
            showLogin(hashUser);
            history.replaceState(null, '', window.location.pathname);
        }
    </script>
</body>
</html>
