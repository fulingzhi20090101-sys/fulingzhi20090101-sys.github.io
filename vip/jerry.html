<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jerry 的专属空间 | 老付家</title>
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; --gold: #f1c40f; --bg: #f8f9fa; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--primary); margin: 0; min-height: 100vh; padding: 20px 0; }
        .page { width: 90%; max-width: 500px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; margin-bottom: 20px; }
        .profile .avatar { font-size: 4rem; cursor: pointer; transition: transform 0.3s; }
        .profile .avatar:hover { transform: scale(1.1); }
        .profile h1 { font-size: 1.8rem; margin: 8px 0 5px; }
        .badge { display: inline-block; background: linear-gradient(135deg, var(--gold), #f39c12); color: white; padding: 4px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
        .avatar-picker { display: none; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 15px; }
        .avatar-picker.active { display: flex; }
        .avatar-picker span { font-size: 2rem; cursor: pointer; padding: 6px; border-radius: 10px; transition: all 0.2s; }
        .avatar-picker span:hover { background: #fef9e7; transform: scale(1.15); }
        .avatar-picker span.selected { background: #fef9e7; border: 2px solid var(--gold); }
        .avatar-hint { color: #95a5a6; font-size: 0.75rem; margin-top: 6px; }
        .currency-bar { display: flex; gap: 8px; justify-content: center; padding: 8px; background: linear-gradient(135deg, #fef9e7, #fff); border-radius: 10px; margin: 8px 0; }
        .currency-item { font-size: 0.85rem; cursor: pointer; padding: 3px 8px; border-radius: 6px; }
        .currency-item.gold { color: #d4a017; font-weight: bold; }
        .currency-item.silver { color: #7f8c8d; font-weight: bold; }
        .currency-item.copper { color: #8b4513; font-weight: bold; }
        .tx-link { color: #3498db; font-size: 0.8rem; cursor: pointer; margin-top: 8px; display: inline-block; }

        .section-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 12px; }
        .user-switcher { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; }
        .user-tab { padding: 8px 16px; border: 2px solid #ecf0f1; border-radius: 10px; cursor: pointer; font-size: 0.9rem; font-weight: bold; transition: all 0.2s; background: #fff; }
        .user-tab:hover { border-color: var(--gold); }
        .user-tab.active { border-color: var(--gold); background: #fef9e7; }

        .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .menu-item { padding: 16px 10px; background: linear-gradient(135deg, #fff, #fef9e7); border: 2px solid #f9e79f; border-radius: 14px; text-decoration: none; color: var(--primary); font-weight: bold; font-size: 0.95rem; transition: all 0.3s; cursor: pointer; text-align: center; display: block; }
        .menu-item:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(241,196,15,0.3); border-color: var(--gold); }
        .menu-item .icon { font-size: 1.8rem; margin-bottom: 6px; }
        .zoo-link { display: block; margin-top: 10px; padding: 14px; background: linear-gradient(135deg,#1a1a2e,#302b63); border-radius: 12px; text-align: center; text-decoration: none; color: #f1c40f; font-size: 1rem; font-weight: bold; }

        .user-info { text-align: left; }
        .user-block { background: #fafafa; border-radius: 12px; padding: 15px; margin-bottom: 12px; border: 1px solid #ecf0f1; }
        .user-block h3 { font-size: 1rem; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
        .info-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 0.85rem; }
        .info-row .label { color: #7f8c8d; }
        .info-row .value { font-weight: bold; }
        .time-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; margin-top: 8px; }
        .time-cell { text-align: center; background: #f8f9fa; padding: 6px 4px; border-radius: 8px; font-size: 0.7rem; }
        .time-cell .num { font-size: 0.85rem; font-weight: bold; color: var(--accent); }
        .time-cell .lbl { color: #95a5a6; }
        .tx-btn { color: #3498db; font-size: 0.8rem; cursor: pointer; margin-top: 6px; display: inline-block; background: none; border: none; padding: 0; }

        .back { display: inline-block; margin-top: 15px; color: #7f8c8d; text-decoration: none; font-size: 0.9rem; }
        .back:hover { color: var(--accent); }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 12px 24px; border-radius: 12px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="page">
        <div class="card profile">
            <div class="avatar" id="currentAvatar" onclick="togglePicker()">🧑‍💻</div>
            <h1>Jerry</h1>
            <div class="badge">👑 VIP 管理员</div>
            <div class="avatar-picker" id="avatarPicker"></div>
            <div class="avatar-hint">点击头像更换（每天可换三次）</div>
            <div id="currencyBar"></div>
            <div class="tx-link" onclick="showTransactions('jerry')">📜 查看交易记录</div>
        </div>

        <div class="card">
            <div class="section-title">📖 学习与游戏</div>
            <div class="user-switcher" id="userSwitcher"></div>
            <div class="menu" id="contentMenu"></div>
            <a href="../games/zoo/index.html" class="zoo-link">🦁 动物园历险记</a>
        </div>

        <div class="card">
            <div class="section-title">💰 每日津贴 & 转账</div>
            <div id="dailyAllowance" style="text-align:center;margin-bottom:15px"></div>
            <div id="transferSection" style="text-align:center">
                <div style="display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap">
                    <select id="transferTo" style="padding:8px 12px;border:2px solid #ecf0f1;border-radius:8px;font-size:1rem"></select>
                    <input type="number" id="transferAmount" placeholder="金额" min="1" style="width:80px;padding:8px;border:2px solid #ecf0f1;border-radius:8px;font-size:1rem">
                    <button onclick="doTransfer()" style="padding:8px 16px;background:linear-gradient(135deg,#f1c40f,#f39c12);border:none;border-radius:8px;color:white;font-weight:bold;cursor:pointer;font-size:1rem">转账</button>
                </div>
            </div>
        </div>

        <div class="card user-info">
            <div class="section-title">👥 用户管理</div>
            <div id="userDashboard"></div>
        </div>

        <div style="text-align:center">
            <a href="#" class="back" onclick="event.preventDefault();showChangePasswordModal()">🔐 修改密码</a>
            &nbsp;&nbsp;
            <a href="#" class="back" onclick="event.preventDefault();VipSession.logout()">🚪 退出登录</a>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="vip_common.js?v=5"></script>
    <script>
        const USER_KEY = 'vip_jerry';
        const AVATARS = ['🧑‍💻','👨‍💼','🦸','🧙','🤖','👾','🐉','🦅','🐯','🐵','🦊','🐼','🎯','🏆','💎','🔥','👦','👧','🧒','🤴','👸','🧑‍🚀','🧑‍🎓','🦋','🐝','🐢','🦈','🐙','🦜','🐿️','🦔','🌸','🌻','🌺','🌵','🍄','🌴','🍀','🎄','👽','👻','🎃','⭐','🌈','🔮','🎪','🦀'];
        const ALL_USERS = [
            { id: 'zy26', name: 'ZY26', defaultAvatar: '🐯' },
            { id: 'george', name: 'George', defaultAvatar: '🐵' },
            { id: 'tom', name: 'Tom', defaultAvatar: '🐱' },
            { id: 'jerry', name: 'Jerry', defaultAvatar: '🧑‍💻' },
        ];
        let selectedContentUser = 'zy26';

        function init() {
            if (!VipSession.requireAuth('jerry')) return;
            VipLogin.record('jerry');
            loadAvatar();
            buildPicker();
            renderCurrencyBar(document.getElementById('currencyBar'), 'jerry');
            try { vipCloudSync('jerry'); } catch(e) {}
            _syncAvatarChanges();
            buildUserSwitcher();
            updateContentMenu();
            buildDashboard();
            syncAdminDashboard();
            claimDailyAllowance();
            buildTransferUI();
        }

        function claimDailyAllowance() {
            const el = document.getElementById('dailyAllowance');
            const token = VipSession.getToken();
            fetch(VIP_API_BASE + '/api/claim-daily', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            }).then(r => r.json()).then(data => {
                if (data.ok && !data.already && data.amount > 0) {
                    el.innerHTML = '<div style="color:#27ae60;font-weight:bold">✅ 今日津贴已领取：+' + data.amount + '文</div>';
                    VipCurrency.setBalance('jerry', data.balance);
                    renderCurrencyBar(document.getElementById('currencyBar'), 'jerry');
                    showToast('每日津贴 +' + data.amount + '文！');
                } else {
                    el.innerHTML = '<div style="color:#95a5a6;font-size:0.85rem">今日津贴已领取 (1000文/天)</div>';
                }
            }).catch(() => {
                el.innerHTML = '<div style="color:#95a5a6;font-size:0.85rem">津贴加载中...</div>';
            });
        }

        function buildTransferUI() {
            const sel = document.getElementById('transferTo');
            sel.innerHTML = '';
            ALL_USERS.filter(u => u.id !== 'jerry').forEach(u => {
                const opt = document.createElement('option');
                opt.value = u.id;
                opt.textContent = u.name;
                sel.appendChild(opt);
            });
        }

        async function doTransfer() {
            const to = document.getElementById('transferTo').value;
            const amount = parseInt(document.getElementById('transferAmount').value, 10);
            if (!to || !amount || amount <= 0) { showToast('请输入有效金额'); return; }

            const token = VipSession.getToken();
            try {
                const resp = await fetch(VIP_API_BASE + '/api/transfer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ to, amount }),
                });
                const data = await resp.json();
                if (data.ok) {
                    VipCurrency.setBalance('jerry', data.fromBalance);
                    VipCurrency.setBalance(to, data.toBalance);
                    renderCurrencyBar(document.getElementById('currencyBar'), 'jerry');
                    buildDashboard();
                    document.getElementById('transferAmount').value = '';
                    const name = ALL_USERS.find(u => u.id === to)?.name || to;
                    showToast('已转 ' + amount + '文 给 ' + name + '！');
                } else {
                    showToast(data.error === 'insufficient funds' ? '铜钱不够！' : (data.error || '转账失败'));
                }
            } catch(e) {
                showToast('网络错误');
            }
        }

        function buildUserSwitcher() {
            const container = document.getElementById('userSwitcher');
            container.innerHTML = '';
            ALL_USERS.forEach(user => {
                const tab = document.createElement('div');
                tab.className = 'user-tab' + (selectedContentUser === user.id ? ' active' : '');
                const avatar = getUserAvatar(user.id, user.defaultAvatar);
                tab.textContent = avatar + ' ' + user.name;
                tab.onclick = () => {
                    selectedContentUser = user.id;
                    buildUserSwitcher();
                    updateContentMenu();
                };
                container.appendChild(tab);
            });
        }

        function updateContentMenu() {
            const menu = document.getElementById('contentMenu');
            const uid = selectedContentUser;
            menu.innerHTML =
                '<a href="' + uid + '_quiz.html" class="menu-item">' +
                    '<div class="icon">✍️</div>做题</a>' +
                '<a href="' + uid + '_game.html" class="menu-item">' +
                    '<div class="icon">🎮</div>游戏</a>';
        }

        function syncAdminDashboard() {
            _apiGet('/api/admin/all').then(data => {
                if (!data) return;
                for (const user of ALL_USERS) {
                    const d = data[user.id];
                    if (!d) continue;
                    if (d.balance) VipCurrency.setBalance(user.id, d.balance);
                    if (d.time) {
                        try { localStorage.setItem('vip_time_' + user.id, JSON.stringify(d.time)); } catch(e) {}
                    }
                    if (d.avatar) {
                        try { localStorage.setItem('vip_' + user.id + '_avatar', d.avatar); } catch(e) {}
                    }
                }
                for (const user of ALL_USERS) {
                    _apiGet('/api/transactions/' + user.id).then(txs => {
                        if (Array.isArray(txs) && txs.length > 0) {
                            try { localStorage.setItem('vip_tx_' + user.id, JSON.stringify(txs)); } catch(e) {}
                        }
                        buildDashboard();
                    });
                }
                renderCurrencyBar(document.getElementById('currencyBar'), 'jerry');
                buildUserSwitcher();
                buildDashboard();
            });
        }

        function loadAvatar() {
            try {
                const saved = localStorage.getItem(USER_KEY + '_avatar');
                if (saved) document.getElementById('currentAvatar').textContent = saved;
            } catch(e) {}
        }

        function _avatarChangesLeft() {
            try {
                const raw = localStorage.getItem(USER_KEY + '_avatar_changes');
                if (!raw) return 3;
                const data = JSON.parse(raw);
                if (data.date !== new Date().toISOString().slice(0, 10)) return 3;
                return Math.max(0, 3 - (data.count || 0));
            } catch(e) { return 3; }
        }

        function _syncAvatarChanges() {
            const today = new Date().toISOString().slice(0, 10);
            _apiGet('/api/daily/jerry?type=avatar_changes&date=' + today).then(data => {
                if (data && typeof data.value === 'number' && data.value > 0) {
                    try { localStorage.setItem(USER_KEY + '_avatar_changes', JSON.stringify({ date: today, count: data.value })); } catch(e) {}
                }
            });
        }

        function _recordAvatarChange() {
            try {
                const today = new Date().toISOString().slice(0, 10);
                const raw = localStorage.getItem(USER_KEY + '_avatar_changes');
                let count = 1;
                if (raw) {
                    const data = JSON.parse(raw);
                    if (data.date === today) count = (data.count || 0) + 1;
                }
                localStorage.setItem(USER_KEY + '_avatar_changes', JSON.stringify({ date: today, count: count }));
                _apiPost('/api/daily/jerry', { type: 'avatar_changes', date: today, value: count });
            } catch(e) {}
        }

        function buildPicker() {
            const picker = document.getElementById('avatarPicker');
            const current = document.getElementById('currentAvatar').textContent;
            picker.innerHTML = '';
            AVATARS.forEach(a => {
                const span = document.createElement('span');
                span.textContent = a;
                if (a === current) span.classList.add('selected');
                span.onclick = () => selectAvatar(a);
                picker.appendChild(span);
            });
        }

        function togglePicker() { document.getElementById('avatarPicker').classList.toggle('active'); }

        function selectAvatar(emoji) {
            const left = _avatarChangesLeft();
            if (left <= 0) { showToast('今天已经换了3次头像，明天再来吧！'); return; }
            document.getElementById('currentAvatar').textContent = emoji;
            vipSaveAvatar('jerry', emoji);
            _recordAvatarChange();
            document.getElementById('avatarPicker').classList.remove('active');
            buildPicker();
            showToast('头像已更新！今天还能换 ' + (left - 1) + ' 次');
        }

        function getUserAvatar(userId, defaultAvatar) {
            try {
                return localStorage.getItem('vip_' + userId + '_avatar') || defaultAvatar;
            } catch(e) { return defaultAvatar; }
        }

        function buildDashboard() {
            const container = document.getElementById('userDashboard');
            container.innerHTML = '';

            for (const user of ALL_USERS) {
                const block = document.createElement('div');
                block.className = 'user-block';

                const avatar = getUserAvatar(user.id, user.defaultAvatar);
                const bal = VipCurrency.getBalance(user.id);
                const fmt = VipCurrency.formatBalance(bal);
                const login = VipLogin.getLast(user.id);
                const stats = VipTime.getStats(user.id);

                let loginStr = '从未登录';
                let deviceStr = '—';
                if (login) {
                    const d = new Date(login.time);
                    loginStr = d.toLocaleDateString('zh-CN') + ' ' + d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
                    deviceStr = login.device || '未知';
                }

                let html = '<h3>' + avatar + ' ' + user.name + '</h3>';
                html += '<div style="margin-bottom:8px">';
                html += '<div class="info-row"><span class="label">💰 财产</span><span class="value">';
                const parts = [];
                if (fmt.gold > 0) parts.push(fmt.gold + '两金');
                if (fmt.silver > 0) parts.push(fmt.silver + '两银');
                parts.push(fmt.copper + '文铜钱');
                html += parts.join('，');
                html += '（共' + fmt.total + '文）</span></div>';
                html += '</div>';
                html += '<div class="info-row"><span class="label">🕐 最近登录</span><span class="value">' + loginStr + '</span></div>';
                html += '<div class="info-row"><span class="label">📱 登录设备</span><span class="value">' + deviceStr + '</span></div>';

                html += '<div style="margin-top:10px;font-size:0.85rem;font-weight:bold">📊 做题时间</div>';
                html += '<div class="time-grid">';
                html += timeCell('今天', stats.quiz.day);
                html += timeCell('本周', stats.quiz.week);
                html += timeCell('本月', stats.quiz.month);
                html += timeCell('总计', stats.quiz.total);
                html += '</div>';

                html += '<div style="margin-top:8px;font-size:0.85rem;font-weight:bold">🎮 游戏时间</div>';
                html += '<div class="time-grid">';
                html += timeCell('今天', stats.game.day);
                html += timeCell('本周', stats.game.week);
                html += timeCell('本月', stats.game.month);
                html += timeCell('总计', stats.game.total);
                html += '</div>';

                html += '<button class="tx-btn" onclick="showTransactions(\'' + user.id + '\')">📜 查看交易记录</button>';
                if (user.id !== 'jerry') {
                    html += ' <button class="tx-btn" onclick="showResetPassword(\'' + user.id + '\',\'' + user.name + '\')">🔐 重置密码</button>';
                }

                block.innerHTML = html;
                container.appendChild(block);
            }
        }

        function timeCell(label, seconds) {
            return '<div class="time-cell"><div class="num">' + formatSeconds(seconds) + '</div><div class="lbl">' + label + '</div></div>';
        }

        function showResetPassword(userId, userName) {
            const existing = document.getElementById('reset-pw-modal');
            if (existing) existing.remove();
            const modal = document.createElement('div');
            modal.id = 'reset-pw-modal';
            modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center';
            modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
            modal.innerHTML = '<div style="background:white;padding:30px;border-radius:16px;max-width:360px;width:90%;text-align:center">' +
                '<h3 style="margin:0 0 15px">🔐 重置 ' + userName + ' 的密码</h3>' +
                '<input type="password" id="resetNewPw" placeholder="输入新密码（至少4位）" style="width:100%;padding:10px;border:2px solid #ecf0f1;border-radius:8px;box-sizing:border-box;font-size:1rem">' +
                '<div id="resetError" style="color:#e74c3c;font-size:0.85rem;margin:8px 0;display:none"></div>' +
                '<div style="display:flex;gap:10px;margin-top:15px">' +
                '<button onclick="this.closest(\'#reset-pw-modal\').remove()" style="flex:1;padding:10px;border:none;border-radius:8px;background:#ecf0f1;color:#7f8c8d;font-size:1rem;cursor:pointer">取消</button>' +
                '<button id="resetBtn" onclick="doResetPassword(\'' + userId + '\')" style="flex:1;padding:10px;border:none;border-radius:8px;background:linear-gradient(135deg,#e74c3c,#c0392b);color:white;font-weight:bold;font-size:1rem;cursor:pointer">重置</button>' +
                '</div></div>';
            document.body.appendChild(modal);
            document.getElementById('resetNewPw').focus();
        }

        async function doResetPassword(userId) {
            const pw = document.getElementById('resetNewPw').value;
            const errEl = document.getElementById('resetError');
            const btn = document.getElementById('resetBtn');
            if (!pw || pw.length < 4) {
                errEl.textContent = '密码至少4位';
                errEl.style.display = 'block';
                return;
            }
            btn.disabled = true;
            btn.textContent = '重置中...';
            try {
                const token = VipSession.getToken();
                const resp = await fetch(VIP_API_BASE + '/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ userId, newPassword: pw }),
                });
                const data = await resp.json();
                if (data.ok) {
                    document.getElementById('reset-pw-modal').remove();
                    showToast('密码已重置！');
                } else {
                    errEl.textContent = data.error || '重置失败';
                    errEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = '重置';
                }
            } catch(e) {
                errEl.textContent = '网络错误';
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = '重置';
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        init();
    </script>
</body>
</html>
