<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>动物园历险记 | 老付家</title>
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; --gold: #f1c40f; --bg: #1a1a2e; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: #fff; touch-action: manipulation; }
        html, body { width: 100%; height: 100%; overflow: hidden; }

        #titleScreen {
            width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding: 20px 0;
            background: linear-gradient(180deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
        }
        .title-logo { font-size: 2.2rem; font-weight: bold; margin-bottom: 4px; text-shadow: 0 0 20px rgba(241,196,15,0.5); }
        .title-sub { color: #aaa; font-size: 0.9rem; margin-bottom: 16px; }
        .start-btn { background: linear-gradient(135deg, var(--gold), #f39c12); color: #fff; border: none; padding: 12px 40px; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .start-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(241,196,15,0.4); }
        .start-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
        .back-link { color: #7f8c8d; text-decoration: none; font-size: 0.85rem; margin-top: 12px; margin-bottom: 20px; }

        .avatar-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-top: 6px; }
        .avatar-btn { width: 100%; aspect-ratio: 1; border: 2px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.08); border-radius: 8px; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; padding: 0; }
        .avatar-btn:hover, .avatar-btn:active { border-color: var(--gold); background: rgba(241,196,15,0.1); }
        .avatar-btn.selected { border-color: var(--gold); background: rgba(241,196,15,0.15); box-shadow: 0 0 12px rgba(241,196,15,0.3); }
        .char-detail { max-width: 360px; width: 92%; background: rgba(255,255,255,0.06); border-radius: 10px; padding: 12px; margin-bottom: 10px; min-height: 60px; }
        .char-detail .d-name { font-size: 1rem; font-weight: bold; color: var(--gold); margin-bottom: 4px; }
        .char-detail .d-desc { font-size: 0.8rem; color: #ccc; margin-bottom: 6px; }
        .char-detail .d-stats { display: flex; gap: 8px; flex-wrap: wrap; font-size: 0.75rem; }
        .char-detail .d-stats span { background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 6px; }

        #gameScreen { display: none; width: 100%; height: 100%; position: relative; justify-content: center; align-items: center; background: #000; }
        #gameCanvas { display: block; background: #000; width: 100%; height: 100%; }

        .d-pad { position: fixed; bottom: 30px; right: 20px; z-index: 10; display: none; width: 180px; height: 180px; }
        .d-pad.active { display: block; }
        .d-pad button { position: absolute; width: 56px; height: 56px; border: 2px solid rgba(255,255,255,0.25); background: rgba(0,0,0,0.45); color: #fff; font-size: 1.6rem; border-radius: 14px; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
        .d-pad button:active, .d-pad button.pressed { background: rgba(255,255,255,0.35); }
        .d-pad .up { left: 62px; top: 0; }
        .d-pad .down { left: 62px; top: 124px; }
        .d-pad .left { left: 0; top: 62px; }
        .d-pad .right { left: 124px; top: 62px; }
        .d-pad .center { left: 62px; top: 62px; font-size: 1.2rem; background: rgba(241,196,15,0.3); border-color: rgba(241,196,15,0.4); }
        #exitBtn { position: fixed; top: 12px; right: 12px; z-index: 10; display: none; width: 44px; height: 44px; border: 2px solid rgba(255,255,255,0.25); background: rgba(0,0,0,0.5); color: #fff; font-size: 1.2rem; border-radius: 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        #exitBtn:active { background: rgba(255,255,255,0.3); }
        .theme-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; width: 92%; max-width: 360px; }
        .theme-btn { flex: 1; padding: 8px 4px; border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color: #fff; border-radius: 10px; cursor: pointer; text-align: center; font-size: 0.75rem; transition: all 0.2s; }
        .theme-btn:active, .theme-btn.selected { border-color: var(--gold); background: rgba(241,196,15,0.12); }
        .theme-btn .t-icon { font-size: 1.2rem; display: block; margin-bottom: 2px; }
        .theme-btn .t-name { font-weight: bold; }
        .name-input { width: 100%; padding: 10px 12px; border: 2px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        .name-input:focus { border-color: var(--gold); }
        .name-input::placeholder { color: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <div id="titleScreen">
        <div class="title-logo">🦁 动物园历险记</div>
        <div class="title-sub" id="titleSub">加载中...</div>

        <div id="menuScreen" style="display:none;text-align:center;width:90%;max-width:400px">
            <div class="theme-row" id="themeRow">
                <button class="theme-btn selected" data-theme="classic" onclick="selectTheme('classic')"><span class="t-icon">🎭</span><span class="t-name">经典</span></button>
                <button class="theme-btn" data-theme="retro" onclick="selectTheme('retro')"><span class="t-icon">📟</span><span class="t-name">怀旧</span></button>
                <button class="theme-btn" data-theme="pixel" onclick="selectTheme('pixel')"><span class="t-icon">🎮</span><span class="t-name">像素</span></button>
            </div>
            <button class="start-btn" style="width:100%;margin-bottom:15px" onclick="showNewGame()">⚔️ 新的冒险</button>
            <button class="start-btn" id="continueBtn" style="width:100%;background:linear-gradient(135deg,#3498db,#2980b9);display:none" onclick="continueGame()">📜 旧的回忆</button>
            <div id="saveInfo" style="color:#888;font-size:0.8rem;margin-top:10px"></div>
        </div>

        <div id="charScreen" style="display:none;width:100%;flex-direction:column;align-items:center">
            <div style="max-width:360px;width:92%;margin-bottom:12px">
                <label style="color:#aaa;font-size:0.85rem;display:block;margin-bottom:4px">角色名字</label>
                <input type="text" id="playerNameInput" class="name-input" placeholder="输入你的名字" maxlength="8">
            </div>
            <div style="max-width:360px;width:92%;margin-bottom:12px">
                <label style="color:#aaa;font-size:0.85rem;display:block;margin-bottom:4px">选择头像</label>
                <div class="avatar-grid" id="avatarGrid"></div>
            </div>
            <div class="char-detail" id="charDetail">
                <div style="color:#888;text-align:center;padding:15px">← 输入名字并选择头像</div>
            </div>
            <button class="start-btn" id="startBtn" disabled onclick="startNewGame()">开始冒险</button>
            <button class="back-link" style="border:none;background:none;cursor:pointer;margin-top:15px" onclick="showMenu()">← 返回</button>
        </div>

        <a href="../../index.html" class="back-link" style="margin-top:20px">← 返回主页</a>
    </div>

    <div id="gameScreen">
        <canvas id="gameCanvas"></canvas>
        <button id="exitBtn" onclick="exitGame()">✕</button>
        <div class="d-pad" id="dpad">
            <button class="up" data-dx="0" data-dy="-1">▲</button>
            <button class="down" data-dx="0" data-dy="1">▼</button>
            <button class="left" data-dx="-1" data-dy="0">◀</button>
            <button class="right" data-dx="1" data-dy="0">▶</button>
            <button class="center" id="dpadConfirm">确定</button>
        </div>
    </div>

    <script src="engine.js?v=18"></script>
    <script src="themes.js?v=18"></script>
    <script src="characters.js?v=18"></script>
    <script src="maps.js?v=18"></script>
    <script src="game.js?v=18"></script>
    <script>
        const AVATARS = ['🧒','👦','👧','👨','👩','🧓','👴','👵','🐶','🐱','🐰','🐼','🐨','🦊','🐯','🦁','🐮','🐷','🐵','🐸','🐲','🦄','🐧','🐺'];
        let selectedAvatar = null;
        let savedGame = null;

        function selectTheme(theme) {
            currentTheme = theme;
            document.querySelectorAll('.theme-btn').forEach(b => {
                b.classList.toggle('selected', b.dataset.theme === theme);
            });
            try { localStorage.setItem('zoo_theme', theme); } catch(e) {}
        }

        function loadTheme() {
            try {
                const t = localStorage.getItem('zoo_theme');
                if (t && THEME_INFO[t]) {
                    currentTheme = t;
                    document.querySelectorAll('.theme-btn').forEach(b => {
                        b.classList.toggle('selected', b.dataset.theme === t);
                    });
                }
            } catch(e) {}
        }

        function initTitle() {
            loadTheme();
            buildAvatarGrid();
            document.getElementById('titleSub').textContent = '正在检查存档...';
            loadSaveFromCloud().then(save => {
                savedGame = save;
                showMenu();
            }).catch(() => {
                savedGame = getLocalSave();
                showMenu();
            });
        }

        function showMenu() {
            document.getElementById('menuScreen').style.display = 'block';
            document.getElementById('charScreen').style.display = 'none';
            if (savedGame && savedGame.playerName) {
                document.getElementById('continueBtn').style.display = 'block';
                const info = savedGame.playerEmoji + ' ' + savedGame.playerName + ' Lv.' + savedGame.player.level;
                let timeStr = '';
                if (savedGame.savedAt) {
                    const d = new Date(savedGame.savedAt);
                    timeStr = ' · 上次保存: ' + d.toLocaleDateString('zh-CN') + ' ' + d.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
                }
                document.getElementById('saveInfo').textContent = '存档: ' + info + timeStr;
                document.getElementById('titleSub').textContent = '选择你的旅程';
            } else {
                document.getElementById('continueBtn').style.display = 'none';
                document.getElementById('saveInfo').textContent = '';
                document.getElementById('titleSub').textContent = '创建你的角色';
                showNewGame();
                return;
            }
        }

        function showNewGame() {
            if (savedGame && savedGame.playerName) {
                const name = savedGame.playerEmoji + ' ' + savedGame.playerName + ' Lv.' + savedGame.player.level;
                if (!confirm('开始新的冒险将覆盖当前存档！\n\n当前存档: ' + name + '\n\n确定要开始新冒险吗？')) {
                    return;
                }
            }
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('charScreen').style.display = 'flex';
            document.getElementById('titleSub').textContent = '创建你的角色';
            document.getElementById('playerNameInput').focus();
        }

        function buildAvatarGrid() {
            const grid = document.getElementById('avatarGrid');
            AVATARS.forEach(emoji => {
                const btn = document.createElement('button');
                btn.className = 'avatar-btn';
                btn.textContent = emoji;
                btn.dataset.emoji = emoji;
                btn.onclick = () => selectAvatarBtn(emoji);
                grid.appendChild(btn);
            });
            document.getElementById('playerNameInput').addEventListener('input', updateCharCreation);
        }

        function selectAvatarBtn(emoji) {
            selectedAvatar = emoji;
            document.querySelectorAll('.avatar-btn').forEach(b => {
                b.classList.toggle('selected', b.dataset.emoji === emoji);
            });
            updateCharCreation();
        }

        function updateCharCreation() {
            const name = document.getElementById('playerNameInput').value.trim();
            const ready = name.length > 0 && selectedAvatar;
            document.getElementById('startBtn').disabled = !ready;

            if (ready) {
                document.getElementById('charDetail').innerHTML =
                    '<div class="d-name">' + selectedAvatar + ' ' + name + '</div>' +
                    '<div class="d-desc">准备开始动物园大冒险！</div>' +
                    '<div class="d-stats">' +
                    '<span>❤️ 体力 100</span>' +
                    '<span>✨ 精力 100</span>' +
                    '<span>💪 力量 10</span>' +
                    '<span>🏃 敏捷 10</span>' +
                    '<span>🧠 智慧 10</span>' +
                    '<span>💰 10元</span>' +
                    '</div>';
            } else {
                document.getElementById('charDetail').innerHTML =
                    '<div style="color:#888;text-align:center;padding:15px">← 输入名字并选择头像</div>';
            }
        }

        function continueGame() {
            if (!savedGame || !savedGame.playerName) return;
            enterGame();
            initGameFromSave(savedGame);
        }

        function startNewGame() {
            const name = document.getElementById('playerNameInput').value.trim();
            if (!name || !selectedAvatar) return;
            if (savedGame && savedGame.playerName) {
                fetch(SAVE_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...savedGame, _backup: true }),
                }).catch(() => {});
            }
            enterGame();
            initGame(name, selectedAvatar);
        }

        function enterGame() {
            document.getElementById('titleScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            document.getElementById('dpad').classList.add('active');
            document.getElementById('exitBtn').style.display = 'block';
            setupDpad();
            if (!ZooEngine.isLoaded()) {
                ZooEngine.loadAssets('').catch(() => {});
            }

            const canvas = document.getElementById('gameCanvas');
            let _lastTouchClickTime = 0;
            function canvasXY(clientX, clientY) {
                const r = canvas.getBoundingClientRect();
                return { x: (clientX - r.left) * (canvas.width / r.width), y: (clientY - r.top) * (canvas.height / r.height) };
            }
            canvas.addEventListener('click', e => {
                if (Date.now() - _lastTouchClickTime < 500) return;
                const c = canvasXY(e.clientX, e.clientY);
                handleCanvasClick(c.x, c.y);
            });
            canvas.addEventListener('touchstart', e => {
                _lastTouchClickTime = Date.now();
                const t = e.touches[0];
                const c = canvasXY(t.clientX, t.clientY);
                handleCanvasClick(c.x, c.y);
            }, { passive: true });
        }

        function setupDpad() {
            let moveInterval = null;
            const dpad = document.getElementById('dpad');
            const dirBtns = dpad.querySelectorAll('[data-dx]');

            function startMove(btn) {
                const dx = parseInt(btn.dataset.dx);
                const dy = parseInt(btn.dataset.dy);
                btn.classList.add('pressed');
                movePlayer(dx, dy);
                clearInterval(moveInterval);
                moveInterval = setInterval(() => movePlayer(dx, dy), 180);
            }
            function stopMove() {
                dirBtns.forEach(b => b.classList.remove('pressed'));
                clearInterval(moveInterval);
                moveInterval = null;
            }

            dirBtns.forEach(btn => {
                btn.addEventListener('touchstart', e => { e.preventDefault(); startMove(btn); }, { passive: false });
                btn.addEventListener('touchend', e => { e.preventDefault(); stopMove(); }, { passive: false });
                btn.addEventListener('touchcancel', e => { stopMove(); });
                btn.addEventListener('mousedown', e => { e.preventDefault(); startMove(btn); });
            });
            document.addEventListener('mouseup', stopMove);

            const confirmBtn = document.getElementById('dpadConfirm');
            function handleConfirm(e) {
                if (e) e.preventDefault();
                if (!gameState) return;
                if (gameState.mode === 'explore') {
                    _menuOpenTime = Date.now();
                    gameState.mode = 'game_menu';
                } else if (gameState.mode === 'dialog') {
                    if (Date.now() - _npcMenuActionTime < 400) return;
                    gameState.mode = 'explore';
                    gameState.dialog = null;
                } else if (gameState.mode === 'npc_menu') {
                    handleNpcMenuAction('leave');
                } else if (gameState.mode === 'game_menu') {
                    gameState.mode = 'explore';
                } else if (gameState.mode === 'shop') {
                    gameState.shop = null;
                    gameState.mode = 'explore';
                } else if (gameState.mode === 'confirm') {
                    gameState.confirm = null;
                    gameState.mode = 'explore';
                } else if (gameState.mode === 'char_info' || gameState.mode === 'inventory') {
                    gameState.mode = 'game_menu';
                }
            }
            confirmBtn.addEventListener('touchstart', e => handleConfirm(e), { passive: false });
            confirmBtn.addEventListener('click', () => handleConfirm(null));
        }

        initTitle();
    </script>
</body>
</html>
