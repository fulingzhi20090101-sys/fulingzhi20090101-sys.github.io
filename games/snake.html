<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>老付家专属贪吃蛇 | Laofujia.com</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #2c3e50; color: white; font-family: sans-serif; flex-direction: column; }
        canvas { border: 5px solid #ecf0f1; background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .info { text-align: center; margin-bottom: 10px; }
        .speed-bar { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; }
        .speed-btn { width: 30px; height: 30px; border: 2px solid #555; border-radius: 6px; background: #34495e; color: #fff; font-weight: bold; font-size: 14px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
        .speed-btn:hover { border-color: #f1c40f; }
        .speed-btn.active { background: #e67e22; border-color: #f1c40f; }
        .speed-label { font-size: 0.85rem; color: #95a5a6; margin-right: 4px; }
        .back-btn { margin-top: 20px; text-decoration: none; color: #3498db; font-weight: bold; }
        .hint { color: #7f8c8d; font-size: 0.8rem; margin-top: 6px; }
    </style>
</head>
<body>
    <div class="info">
        <h1>🎮 老付家贪吃蛇</h1>
        <p>分数: <span id="score">0</span> | 使用方向键开始游戏</p>
        <div class="speed-bar">
            <span class="speed-label">速度:</span>
        </div>
        <div class="hint">按数字键 1~9/0 或 +/- 调速</div>
    </div>
    <canvas id="game" width="400" height="400"></canvas>
    <a href="javascript:history.back()" class="back-btn">← 返回</a>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        let score = 0;
        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 0, dy = 0;
        let gameStarted = false;
        let speed = 5;
        let gameTimer = null;

        function speedToInterval(s) {
            return 300 - (s - 1) * 25;
        }

        function buildSpeedBar() {
            const bar = document.querySelector('.speed-bar');
            bar.innerHTML = '<span class="speed-label">速度:</span>';
            for (let i = 1; i <= 10; i++) {
                const btn = document.createElement('div');
                btn.className = 'speed-btn' + (i === speed ? ' active' : '');
                btn.textContent = i;
                btn.onclick = () => setSpeed(i);
                bar.appendChild(btn);
            }
        }

        function setSpeed(s) {
            speed = Math.max(1, Math.min(10, s));
            buildSpeedBar();
            restartTimer();
        }

        function restartTimer() {
            if (gameTimer) clearInterval(gameTimer);
            gameTimer = setInterval(draw, speedToInterval(speed));
        }

        function draw() {
            let head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if (head.x < 0 || head.x > 19 || head.y < 0 || head.y > 19 || snake.some((s, i) => i !== 0 && s.x === head.x && s.y === head.y)) {
                alert("游戏结束！得分: " + score);
                snake = [{x: 10, y: 10}]; dx = 0; dy = 0; score = 0; gameStarted = false;
                scoreElement.innerText = score;
                return;
            }

            if (gameStarted) {
                snake.unshift(head);
                if(head.x === food.x && head.y === food.y) {
                    score += 10;
                    scoreElement.innerText = score;
                    food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
                } else { snake.pop(); }
            }

            ctx.fillStyle = 'black'; ctx.fillRect(0,0,400,400);
            ctx.fillStyle = '#2ecc71'; snake.forEach(s=>ctx.fillRect(s.x*20,s.y*20,18,18));
            ctx.fillStyle = '#e74c3c'; ctx.fillRect(food.x*20,food.y*20,18,18);
        }

        document.addEventListener('keydown', e => {
            gameStarted = true;
            const key = e.key.toLowerCase();

            if((key === 'arrowup' || key === 'w') && dy === 0) { dx = 0; dy = -1; }
            if((key === 'arrowdown' || key === 's') && dy === 0) { dx = 0; dy = 1; }
            if((key === 'arrowleft' || key === 'a') && dx === 0) { dx = -1; dy = 0; }
            if((key === 'arrowright' || key === 'd') && dx === 0) { dx = 1; dy = 0; }

            if (key >= '1' && key <= '9') setSpeed(parseInt(key));
            if (key === '0') setSpeed(10);
            if (key === '=' || key === '+') setSpeed(speed + 1);
            if (key === '-') setSpeed(speed - 1);
        });

        buildSpeedBar();
        restartTimer();
    </script>
</body>
</html>
