<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老付家 | Laofujia.com</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e67e22;
            --gold: #f1c40f;
            --bg-color: #f8f9fa;
        }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg-color); color: var(--primary-color); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: white; width: 90%; max-width: 500px; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; border-bottom: 3px solid var(--accent-color); display: inline-block; padding-bottom: 5px; }
        p { color: #7f8c8d; line-height: 1.6; }

        .section-label { font-size: 1rem; font-weight: bold; color: #7f8c8d; margin-top: 30px; margin-bottom: 12px; }

        .vip-users { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .vip-card { padding: 20px 10px; background: linear-gradient(135deg, #fff 0%, #fef9e7 100%); border: 2px solid #f9e79f; border-radius: 14px; text-decoration: none; color: var(--primary-color); transition: all 0.3s ease; cursor: pointer; }
        .vip-card:hover { transform: translateY(-4px); box-shadow: 0 6px 20px rgba(241,196,15,0.3); border-color: var(--gold); }
        .vip-avatar { font-size: 2.5rem; margin-bottom: 6px; }
        .vip-name { font-size: 1rem; font-weight: bold; }

        .footer { margin-top: 30px; font-size: 0.8rem; color: #bdc3c7; }
    </style>
</head>
<body>
    <div class="card">
        <h1>老付家</h1>
        <p>欢迎来到老付家<br>这里记录学习，分享快乐，还有一些好玩的小游戏。</p>

        <div class="section-label">👑 VIP 通道</div>
        <div class="vip-users" style="grid-template-columns: 1fr 1fr;">
            <a href="vip/index.html#zy26" class="vip-card">
                <div class="vip-avatar" id="avatar_zy26">🐯</div>
                <div class="vip-name">ZY26</div>
            </a>
            <a href="vip/index.html#george" class="vip-card">
                <div class="vip-avatar" id="avatar_george">🐵</div>
                <div class="vip-name">George</div>
            </a>
            <a href="vip/index.html#tom" class="vip-card">
                <div class="vip-avatar" id="avatar_tom">🐱</div>
                <div class="vip-name">Tom</div>
            </a>
            <a href="vip/index.html#jerry" class="vip-card">
                <div class="vip-avatar" id="avatar_jerry">🧑‍💻</div>
                <div class="vip-name">Jerry</div>
            </a>
        </div>

        <div class="footer">
            © 2026 Laofujia.com · 基于 GitHub Pages 驱动
        </div>
    </div>

    <script>
        const API = '';
        ['zy26', 'george', 'tom', 'jerry'].forEach(uid => {
            fetch(API + '/api/avatar/' + uid).then(r => r.json()).then(data => {
                if (data && data.avatar) {
                    const el = document.getElementById('avatar_' + uid);
                    if (el) el.textContent = data.avatar;
                }
            }).catch(() => {});
        });
    </script>
</body>
</html>
